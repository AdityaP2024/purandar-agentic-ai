name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin manifests are valid JSON
        run: |
          status=0
          count=0
          for m in plugins/*/.claude-plugin/plugin.json; do
            [ -e "$m" ] || continue
            count=$((count + 1))
            jq empty "$m" || { echo "FAIL: $m is not valid JSON"; status=1; continue; }
            jq -e '.name and .version and .description' "$m" > /dev/null || { echo "FAIL: $m is missing name/version/description"; status=1; }
          done
          [ "$count" -eq 3 ] || { echo "FAIL: expected 3 plugin manifests, found $count"; status=1; }
          jq empty .claude-plugin/marketplace.json || exit 1
          jq -e '.name and (.plugins | length == 3)' .claude-plugin/marketplace.json > /dev/null || { echo "FAIL: marketplace must list exactly 3 plugins"; status=1; }
          # Every marketplace entry's source dir must exist, carry a plugin.json,
          # and that manifest's name must equal the entry's name.
          while IFS=$'\t' read -r name source; do
            dir="${source#./}"
            [ -d "$dir" ] || { echo "FAIL: marketplace source $source does not exist"; status=1; continue; }
            mf="$dir/.claude-plugin/plugin.json"
            [ -f "$mf" ] || { echo "FAIL: $source has no .claude-plugin/plugin.json"; status=1; continue; }
            actual=$(jq -r '.name' "$mf")
            [ "$actual" = "$name" ] || { echo "FAIL: $mf name '$actual' != marketplace entry '$name'"; status=1; }
          done < <(jq -r '.plugins[] | [.name, .source] | @tsv' .claude-plugin/marketplace.json)
          exit $status

      - name: Agents and commands have YAML frontmatter
        run: |
          status=0
          for f in plugins/*/agents/*.md plugins/*/commands/*.md; do
            [ -e "$f" ] || continue
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "FAIL: $f is missing YAML frontmatter (must start with ---)"
              status=1
              continue
            fi
            fm=$(awk '/^---$/{n++; next} n==1{print}' "$f")
            for field in name description; do
              if ! printf '%s\n' "$fm" | grep -q "^${field}:"; then
                echo "FAIL: $f frontmatter is missing '${field}:'"
                status=1
              fi
            done
          done
          exit $status

      - name: Skills have SKILL.md with frontmatter
        run: |
          status=0
          for d in plugins/*/skills/*/; do
            [ -d "$d" ] || continue
            # Skeleton phase: empty skill dirs (only .gitkeep) are allowed
            if [ -z "$(find "$d" -type f ! -name '.gitkeep' | head -n 1)" ]; then
              continue
            fi
            if [ ! -f "${d}SKILL.md" ]; then
              echo "FAIL: ${d} has content but no SKILL.md"
              status=1
              continue
            fi
            if [ "$(head -n 1 "${d}SKILL.md")" != "---" ]; then
              echo "FAIL: ${d}SKILL.md is missing YAML frontmatter"
              status=1
            fi
          done
          exit $status

      - name: Hooks are valid and executable
        run: |
          status=0
          for h in plugins/*/hooks/hooks.json; do
            [ -e "$h" ] || continue
            jq empty "$h" || { echo "FAIL: $h is not valid JSON"; status=1; continue; }
            jq -e '.hooks | length > 0' "$h" > /dev/null || { echo "FAIL: $h has no hooks"; status=1; }
          done
          for s in plugins/*/hooks/scripts/*.sh plugins/*/scripts/*.sh; do
            [ -e "$s" ] || continue
            bash -n "$s" || { echo "FAIL: $s has syntax errors"; status=1; }
            [ -x "$s" ] || { echo "FAIL: $s is not executable"; status=1; }
          done
          for p in plugins/*/scripts/*.py; do
            [ -e "$p" ] || continue
            python3 -m py_compile "$p" || { echo "FAIL: $p has syntax errors"; status=1; }
            [ -x "$p" ] || { echo "FAIL: $p is not executable"; status=1; }
          done
          exit $status

      - name: Hook behavior smoke tests
        run: |
          status=0
          run_git() { printf '{"tool_name":"Bash","tool_input":{"command":%s}}' "$(printf '%s' "$1" | jq -Rs .)" | plugins/ai-agent/hooks/scripts/block-git-writes.sh 2>/dev/null; echo $?; }
          run_write() { printf '{"tool_name":"Write","tool_input":{"file_path":"x","content":%s}}' "$(printf '%s' "$1" | jq -Rs .)" | plugins/ai-agent/hooks/scripts/guard-writes.sh 2>/dev/null; echo $?; }
          [ "$(run_git 'git commit -m x')" = "2" ] || { echo "FAIL: git commit not denied"; status=1; }
          [ "$(run_git 'git push')" = "2" ] || { echo "FAIL: git push not denied"; status=1; }
          [ "$(run_git 'git push;echo done')" = "2" ] || { echo "FAIL: metachar bypass not denied"; status=1; }
          [ "$(run_git 'git tag -l && git tag v2')" = "2" ] || { echo "FAIL: tag-creation-after-list not denied"; status=1; }
          [ "$(run_git 'git status')" = "0" ] || { echo "FAIL: git status wrongly denied"; status=1; }
          [ "$(run_git 'git tag -l')" = "0" ] || { echo "FAIL: git tag -l wrongly denied"; status=1; }
          [ "$(run_git 'git grep push')" = "0" ] || { echo "FAIL: git grep push wrongly denied"; status=1; }
          # Smoke token is assembled at runtime so this file never contains a
          # token-shaped literal — keeping workflow files inside the secret scan.
          p='ghp_'; tok="${p}AbCdEfGhIjKlMnOpQrStUvWxYz1234"
          [ "$(run_write "token = $tok")" = "2" ] || { echo "FAIL: token not denied"; status=1; }
          s='123-45'; ssn="ssn: ${s}-6789"
          [ "$(run_write "$ssn")" = "2" ] || { echo "FAIL: SSN not denied"; status=1; }
          [ "$(run_write 'log.info("id={}", m.getId());')" = "0" ] || { echo "FAIL: clean content wrongly denied"; status=1; }
          exit $status

      - name: Observability hook smoke tests
        run: |
          status=0
          export CLAUDE_PROJECT_DIR="$(mktemp -d)"
          log="$CLAUDE_PROJECT_DIR/.claude/ai-agent-metrics/events.jsonl"
          run_log() { printf '%s' "$1" | plugins/ai-agent/hooks/scripts/log-events.sh; echo $?; }
          [ "$(run_log '{"session_id":"s1","tool_name":"Skill","tool_input":{"skill":"spring-boot"}}')" = "0" ] || { echo "FAIL: log hook exited non-zero"; status=1; }
          grep -q '"event":"skill"' "$log" || { echo "FAIL: skill event not logged"; status=1; }
          run_log '{"session_id":"s1","tool_name":"Task","tool_input":{"subagent_type":"backend-springboot","prompt":"PROMPT-MUST-NOT-APPEAR"}}' > /dev/null
          grep -q '"event":"agent"' "$log" || { echo "FAIL: agent spawn not logged"; status=1; }
          run_log '{"session_id":"s1","tool_name":"Read","tool_input":{"file_path":"skills/hipaa/SKILL.md"}}' > /dev/null
          grep -q '"event":"read"' "$log" || { echo "FAIL: SKILL.md read not logged"; status=1; }
          run_log '{"session_id":"s1","tool_name":"Read","tool_input":{"file_path":"src/main/java/App.java"}}' > /dev/null
          [ "$(wc -l < "$log")" -eq 3 ] || { echo "FAIL: uninteresting read was logged"; status=1; }
          run_log '{"session_id":"s1","tool_name":"Read","tool_input":{"file_path":"docs/input-specs/srs.pdf"}}' > /dev/null
          grep -q 'docs/input-specs/srs.pdf' "$log" || { echo "FAIL: input-specs read not logged"; status=1; }
          run_log '{"session_id":"s1","tool_name":"Write","tool_input":{"file_path":"docs/tickets/AB-1/research.md","content":"CONTENT-MUST-NOT-APPEAR"}}' > /dev/null
          grep -q '"event":"artifact_write"' "$log" || { echo "FAIL: artifact write not logged"; status=1; }
          if grep -qE 'MUST-NOT-APPEAR' "$log"; then echo "FAIL: content/prompt leaked into log"; status=1; fi
          [ -f "$CLAUDE_PROJECT_DIR/.claude/ai-agent-metrics/.gitignore" ] || { echo "FAIL: metrics dir is not self-ignoring"; status=1; }
          rc=$(printf '{"session_id":"s1","tool_name":"Bash","tool_input":{"command":"git push"}}' | plugins/ai-agent/hooks/scripts/block-git-writes.sh 2>/dev/null; echo $?)
          [ "$rc" = "2" ] || { echo "FAIL: git push not denied with metrics enabled"; status=1; }
          grep -q '"event":"denial"' "$log" && grep -q '"rule":"git-write"' "$log" || { echo "FAIL: git-write denial not logged"; status=1; }
          rc=$(printf '{"session_id":"s1","tool_name":"Write","tool_input":{"file_path":"x.md","content":"ssn: 123-45-6789"}}' | plugins/ai-agent/hooks/scripts/guard-writes.sh 2>/dev/null; echo $?)
          [ "$rc" = "2" ] || { echo "FAIL: SSN not denied with metrics enabled"; status=1; }
          grep -q '"hook":"guard-writes"' "$log" || { echo "FAIL: guard-writes denial not logged"; status=1; }
          if grep -q '123-45-6789' "$log"; then echo "FAIL: denied value leaked into log"; status=1; fi
          unset CLAUDE_PROJECT_DIR
          exit $status

      - name: Scaffold hook smoke tests
        run: |
          status=0
          # Repo that enables the plugin: scaffolds both dirs with READMEs, prints one note
          proj=$(mktemp -d)
          mkdir -p "$proj/.claude"
          printf '{"enabledPlugins":{"ai-agent@purandar-ai":true}}' > "$proj/.claude/settings.json"
          out=$(CLAUDE_PROJECT_DIR="$proj" plugins/ai-agent/hooks/scripts/scaffold-dirs.sh < /dev/null)
          [ -d "$proj/docs/input-specs" ] && [ -d "$proj/docs/output-specs" ] || { echo "FAIL: dirs not scaffolded"; status=1; }
          [ -f "$proj/docs/input-specs/README.md" ] && [ -f "$proj/docs/output-specs/README.md" ] || { echo "FAIL: READMEs missing"; status=1; }
          printf '%s' "$out" | grep -q 'scaffolded' || { echo "FAIL: creation note not printed"; status=1; }
          # Idempotent: rerun is silent and never touches existing files
          printf 'custom' > "$proj/docs/input-specs/README.md"
          out=$(CLAUDE_PROJECT_DIR="$proj" plugins/ai-agent/hooks/scripts/scaffold-dirs.sh < /dev/null)
          [ -z "$out" ] || { echo "FAIL: rerun not silent"; status=1; }
          [ "$(cat "$proj/docs/input-specs/README.md")" = "custom" ] || { echo "FAIL: existing README overwritten"; status=1; }
          # Unrelated repo (no plugin enablement, no docs/): must NOT scaffold
          bare=$(mktemp -d)
          CLAUDE_PROJECT_DIR="$bare" plugins/ai-agent/hooks/scripts/scaffold-dirs.sh < /dev/null > /dev/null
          [ ! -d "$bare/docs" ] || { echo "FAIL: scaffolded an unrelated repo"; status=1; }
          # Existing docs/ tree counts as opt-in even without settings.json
          mkdir -p "$bare/docs"
          CLAUDE_PROJECT_DIR="$bare" plugins/ai-agent/hooks/scripts/scaffold-dirs.sh < /dev/null > /dev/null
          [ -d "$bare/docs/input-specs" ] && [ -d "$bare/docs/output-specs" ] || { echo "FAIL: docs-tree repo not scaffolded"; status=1; }
          # Context-pointer repo: enablement present but a pointer file means docs
          # live in the context repo — the hook must scaffold NOTHING locally
          ptr=$(mktemp -d)
          mkdir -p "$ptr/.claude"
          printf '{"enabledPlugins":{"ai-agent@purandar-ai":true}}' > "$ptr/.claude/settings.json"
          printf '{"contextRoot":"../project-context/docs"}' > "$ptr/.claude/ai-agent.json"
          out=$(CLAUDE_PROJECT_DIR="$ptr" plugins/ai-agent/hooks/scripts/scaffold-dirs.sh < /dev/null)
          [ -z "$out" ] || { echo "FAIL: pointer repo produced output"; status=1; }
          [ ! -d "$ptr/docs" ] || { echo "FAIL: pointer repo was scaffolded locally"; status=1; }
          exit $status

      - name: Metrics aggregation smoke test
        run: |
          status=0
          base=$(mktemp -d)
          mkdir -p "$base/repo-a/docs" "$base/repo-b"
          printf '| Date | Ticket | Mode | PASS | WARN | FAIL | NO-DATA | Denials | Notes |\n|---|---|---|---|---|---|---|---|---|\n| 2026-08-01 | AB-1 | full | 3 | 1 | 0 | 0 | 0 | clean |\n| 2026-08-02 | AB-2 | full | 4 | 0 | 1 | 0 | 1 | denial seen |\n| malformed |\n' > "$base/repo-a/docs/agent-metrics.md"
          out=$(plugins/ai-agent/scripts/aggregate-metrics.sh "$base/repo-a" "$base/repo-b" "$base/nope")
          echo "$out" | grep -qE '\| repo-a \| 2 \| 7 \| 1 \| 1 \| 0 \| 1 \|' || { echo "FAIL: repo-a totals wrong"; status=1; }
          echo "$out" | grep -qE '\| \*\*TOTAL\*\* \| 2 \| 7 \| 1 \| 1 \| 0 \| 1 \|' || { echo "FAIL: TOTAL wrong"; status=1; }
          echo "$out" | grep -q 'repo-b | no data' || { echo "FAIL: no-data repo not listed"; status=1; }
          echo "$out" | grep -q 'Malformed rows skipped: 1' || { echo "FAIL: malformed row not counted"; status=1; }
          echo "$out" | grep -q 'Not a directory' || { echo "FAIL: bad path not reported"; status=1; }
          head -1 <(echo "$out") | grep -q '# Team Agent Pipeline Metrics' || { echo "FAIL: header missing"; status=1; }
          exit $status

      - name: xlsx extraction smoke test
        run: |
          status=0
          work=$(mktemp -d)
          python3 - "$work/fixture.xlsx" <<'PYEOF'
          import sys, zipfile
          from datetime import date
          serial = (date(2025, 8, 1) - date(1899, 12, 30)).days
          wb = '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Stories" sheetId="1" r:id="rId1"/><sheet name="Billing" sheetId="2" r:id="rId2"/></sheets></workbook>'
          rels = '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="x" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="x" Target="worksheets/sheet2.xml"/></Relationships>'
          ss = '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><si><t>Module</t></si><si><t>Auth</t></si><si><r><t>rich </t></r><r><t>text</t></r></si><si><t xml:space="preserve">a\tb\nc</t></si></sst>'
          styles = '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cellXfs count="2"><xf numFmtId="0"/><xf numFmtId="14"/></cellXfs></styleSheet>'
          s1 = ('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'
                '<row r="1"><c r="A1" t="s"><v>0</v></c><c r="B1" t="inlineStr"><is><t>Story</t></is></c><c r="C1" t="inlineStr"><is><t>Pts</t></is></c><c r="D1" t="inlineStr"><is><t>Due</t></is></c></row>'
                '<row r="2"><c r="A2" t="s"><v>1</v></c><c r="B2" t="s"><v>2</v></c><c r="C2"><v>3</v></c><c r="D2" s="1"><v>%d</v></c></row>'
                '<row r="3"><c r="A3" t="s"><v>3</v></c><c r="D3" t="b"><v>1</v></c></row>'
                '<row r="4"><c r="A4" t="inlineStr"><is><t></t></is></c></row>'
                '</sheetData></worksheet>' % serial)
          s2 = '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1"><c r="A1" t="inlineStr"><is><t>Invoices</t></is></c></row></sheetData></worksheet>'
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              z.writestr("xl/workbook.xml", wb)
              z.writestr("xl/_rels/workbook.xml.rels", rels)
              z.writestr("xl/sharedStrings.xml", ss)
              z.writestr("xl/styles.xml", styles)
              z.writestr("xl/worksheets/sheet1.xml", s1)
              z.writestr("xl/worksheets/sheet2.xml", s2)
          PYEOF
          [ "$(plugins/ai-agent/scripts/xlsx-extract.py --list "$work/fixture.xlsx")" = "$(printf 'Stories\nBilling')" ] || { echo "FAIL: --list wrong"; status=1; }
          out=$(plugins/ai-agent/scripts/xlsx-extract.py "$work/fixture.xlsx")
          echo "$out" | grep -q '^# sheet: Stories$' && echo "$out" | grep -q '^# sheet: Billing$' || { echo "FAIL: sheet headers missing"; status=1; }
          echo "$out" | grep -q "$(printf 'Auth\trich text\t3\t2025-08-01')" || { echo "FAIL: shared/rich/number/date row wrong"; status=1; }
          echo "$out" | grep -q "$(printf 'a b\\\\nc\t\t\tTRUE')" || { echo "FAIL: escaping/gap/boolean row wrong"; status=1; }
          [ "$(plugins/ai-agent/scripts/xlsx-extract.py "$work/fixture.xlsx" Billing | wc -l)" -eq 2 ] || { echo "FAIL: single-sheet select wrong"; status=1; }
          rc=$(plugins/ai-agent/scripts/xlsx-extract.py "$work/fixture.xlsx" Nope 2>/dev/null; echo $?)
          [ "$rc" = "1" ] || { echo "FAIL: missing sheet not an error"; status=1; }
          printf 'plain' > "$work/notzip.xlsx"
          rc=$(plugins/ai-agent/scripts/xlsx-extract.py "$work/notzip.xlsx" 2>/dev/null; echo $?)
          [ "$rc" = "1" ] || { echo "FAIL: non-zip not an error"; status=1; }
          exit $status

      - name: No committed secrets
        run: |
          # No .github exclusion: workflow files are a common leak location and
          # the smoke-test tokens above are runtime-assembled, never literals.
          if grep -rInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|ATATT[A-Za-z0-9_=-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY)' \
            --exclude-dir=.git .; then
            echo "FAIL: possible committed secret found"
            exit 1
          fi

      - name: No machine-specific absolute paths
        run: |
          if grep -rInE '(/Users/|/home/|C:\\\\Users)' \
            --exclude-dir=.git --exclude-dir=.github --include='*.md' --include='*.json' .; then
            echo "FAIL: machine-specific absolute path found; agents must discover paths at runtime"
            exit 1
          fi

      - name: No cross-plugin file references
        run: |
          # ${CLAUDE_PLUGIN_ROOT} resolves to each plugin's OWN root: a stack plugin
          # referencing core content (or core referencing stack agents) by file path
          # dangles at runtime. Cross-plugin loads go through namespaced Skill
          # invocations; cross-plugin agent launches go by bare agent name.
          status=0
          if grep -rnE 'CLAUDE_PLUGIN_ROOT\}?/(skills/(shared-standards|hipaa|audit-logging)|templates/|scripts/|\.claude-plugin/plugin\.json)' \
            plugins/ai-agent-backend plugins/ai-agent-frontend; then
            echo "FAIL: stack plugin references core content by CLAUDE_PLUGIN_ROOT path"
            status=1
          fi
          if grep -rnE 'CLAUDE_PLUGIN_ROOT\}?/agents/(backend-springboot|frontend-react)' \
            plugins/ai-agent; then
            echo "FAIL: core references a stack agent definition by CLAUDE_PLUGIN_ROOT path"
            status=1
          fi
          exit $status
